<div class="card">
  <div class="card-header">
    <div class="card-icon">🚗</div>
    <div>
      <h2>Registrar Ingreso</h2>
      <p>Registra la entrada de un vehículo al parqueadero</p>
    </div>
  </div>

  <div class="form-group">
    <label>Tipo de vehículo</label>
    <select (change)="onTipoChange($event)">
      <option value="Carro">🚗 Carro</option>
      <option value="Moto">🏍️ Moto</option>
    </select>
  </div>

  <div class="form-group">
    <label>Placa</label>
    <input type="text" [value]="placa" (input)="onPlacaChange($event)" placeholder="Ej: ABC123" maxlength="6" />
  </div>

  <button class="btn btn-primary" (click)="registrar()" [disabled]="cargando">
    <span>{{ cargando ? '⏳' : '' }}</span>
    {{ cargando ? 'Registrando...' : 'Registrar Ingreso' }}
  </button>

  <div class="alert alert-success" *ngIf="mensaje">{{ mensaje }}</div>
  <div class="alert alert-error" *ngIf="error">{{ error }}</div>
</div>
